name: BTC Analysis Telegram

on:
  schedule:
    - cron: "0 5-21 * * *"     # le script filtre 7h-22h Europe/Paris
  workflow_dispatch:

concurrency:
  group: btc-analysis
  cancel-in-progress: false

jobs:
  send-report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SYMBOL: "BTC-USD"
      ASSET_NAME: "BITCOIN (BTC/USD)"
      ASSET_EMOJI: "₿"
      ASSET_SHORT: "BTC"
      NEWS_QUERY: "bitcoin+BTC+price+ETF+crypto"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run BTC report
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python3 gold_report.py --force
          else
            python3 gold_report.py
          fi
