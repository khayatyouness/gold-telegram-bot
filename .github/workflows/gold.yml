name: Gold Analysis Telegram

on:
  schedule:
    # Toutes les heures de 05:00 a 21:00 UTC.
    # Le script filtre lui-meme pour n'envoyer qu'entre 7h et 22h Europe/Paris
    # (gere automatiquement l'heure d'ete/hiver).
    - cron: "0 5-21 * * *"
  workflow_dispatch:        # bouton "Run workflow" pour tester manuellement

concurrency:
  group: gold-analysis
  cancel-in-progress: false

jobs:
  send-report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run gold report
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python3 gold_report.py --force
          else
            python3 gold_report.py
          fi
